
# ==============================================================================
# elektriklioto.com - Mobil CI/CD Pipeline (Flutter Android & iOS)
# Sprint: S6 — Mobil CI/CD ve Build Dağıtımı
# ==============================================================================

name: Mobile CI/CD Pipeline - Flutter Android & iOS

on:
  push:
    branches: [ main, staging, develop ]
    paths:
      - 'src/mobile/**'
      - 'infra/ci/**'
      - 'infra/fastlane/**'
      - 'infra/scripts/**'
      - 'infra/docker/Dockerfile.mobile-builder'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'src/mobile/**'
      - 'infra/**'

jobs:
  lint-and-test:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: src/mobile
        run: flutter pub get

      - name: Static Code Analysis
        working-directory: src/mobile
        run: flutter analyze

      - name: Run Unit & Widget Tests
        working-directory: src/mobile
        run: flutter test --coverage

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: src/mobile/coverage/lcov.info

  build-android:
    name: Build Android (APK & AAB)
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: src/mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: src/mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://api.elektriklioto.com \
            --dart-define=MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }} \
            --dart-define=APP_LINKS_DOMAIN=elektriklioto.com \
            --dart-define=BUILD_FLAVOR=production

      - name: Build Android App Bundle (AAB)
        working-directory: src/mobile
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://api.elektriklioto.com \
            --dart-define=MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }} \
            --dart-define=APP_LINKS_DOMAIN=elektriklioto.com \
            --dart-define=BUILD_FLAVOR=production

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-builds
          path: |
            src/mobile/build/app/outputs/flutter-apk/*.apk
            src/mobile/build/app/outputs/bundle/release/*.aab

  build-ios:
    name: Build iOS Runner & Archive
    needs: lint-and-test
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: src/mobile
        run: flutter pub get

      - name: Build iOS No-Codesign Archive
        working-directory: src/mobile
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=https://api.elektriklioto.com \
            --dart-define=MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }} \
            --dart-define=APP_LINKS_DOMAIN=elektriklioto.com \
            --dart-define=BUILD_FLAVOR=production

      - name: Upload iOS Runner Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-runner-archive
          path: src/mobile/build/ios/archive/*.xcarchive
