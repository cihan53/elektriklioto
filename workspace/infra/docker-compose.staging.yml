
# ==============================================================================
# elektriklioto.com - Staging (Hazırlık) Ortamı Compose Yapılandırması
# ==============================================================================
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: elektriklioto-db-staging
    restart: unless-stopped
    env_file:
      - ./env/.env.staging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elektriklioto_staging}
      POSTGRES_USER: ${POSTGRES_USER:-staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_secure_pass_4321}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    networks:
      - elektriklioto-staging-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staging_user} -d ${POSTGRES_DB:-elektriklioto_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../src/backend
      dockerfile: ../../infra/docker/Dockerfile.api
    container_name: elektriklioto-api-staging
    restart: unless-stopped
    env_file:
      - ./env/.env.staging
    environment:
      NODE_ENV: staging
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-staging_user}:${POSTGRES_PASSWORD:-staging_secure_pass_4321}@postgres:5432/${POSTGRES_DB:-elektriklioto_staging}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elektriklioto-staging-net

  worker:
    build:
      context: ../src/backend
      dockerfile: ../../infra/docker/Dockerfile.worker
    container_name: elektriklioto-worker-staging
    restart: unless-stopped
    env_file:
      - ./env/.env.staging
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://${POSTGRES_USER:-staging_user}:${POSTGRES_PASSWORD:-staging_secure_pass_4321}@postgres:5432/${POSTGRES_DB:-elektriklioto_staging}
      WORKER_POLL_INTERVAL_MS: 1500
      CB_FAILURE_THRESHOLD: 5
      CB_COOLDOWN_MS: 900000
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - elektriklioto-staging-net

  web:
    build:
      context: ../src
      dockerfile: ../infra/docker/Dockerfile.web
    container_name: elektriklioto-web-staging
    restart: unless-stopped
    env_file:
      - ./env/.env.staging
    environment:
      NODE_ENV: staging
      PORT: 3001
    depends_on:
      - api
    networks:
      - elektriklioto-staging-net

  nginx:
    image: nginx:1.27-alpine
    container_name: elektriklioto-nginx-staging
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - elektriklioto-staging-net

networks:
  elektriklioto-staging-net:
    driver: bridge

volumes:
  pgdata_staging:
    driver: local
