
# ==============================================================================
# elektriklioto.com - Staging (Hazırlık) Compose Yapılandırması
# Sprint: S3-S11 — Staging Doğrulama ve TALEP-012 Sürüm Yönetimi
# ==============================================================================
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: elektriklioto-db-staging
    restart: unless-stopped
    env_file:
      - ./env/.env.staging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elektriklioto_staging}
      POSTGRES_USER: ${POSTGRES_USER:-staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_secure_pass_4321}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    networks:
      - elektriklioto-staging-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging_user -d elektriklioto_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../src/backend
      dockerfile: ../../infra/docker/Dockerfile.api
    container_name: elektriklioto-api-staging
    restart: unless-stopped
    env_file:
      - ./env/.env.staging
    environment:
      NODE_ENV: staging
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-staging_user}:${POSTGRES_PASSWORD:-staging_secure_pass_4321}@postgres:5432/${POSTGRES_DB:-elektriklioto_staging}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elektriklioto-staging-net

  worker:
    build:
      context: ../src/backend
      dockerfile: ../../infra/docker/Dockerfile.worker
    container_name: elektriklioto-worker-staging
    restart: unless-stopped
    env_file:
      - ./env/.env.staging
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://${POSTGRES_USER:-staging_user}:${POSTGRES_PASSWORD:-staging_secure_pass_4321}@postgres:5432/${POSTGRES_DB:-elektriklioto_staging}
      WORKER_POLL_INTERVAL_MS: 1500
      CB_FAILURE_THRESHOLD: 5
      CB_COOLDOWN_MS: 900000
      HTTP_TIMEOUT_MS: 5000
      CPO_SYNC_INTERVAL_MINUTES: 15
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - elektriklioto-staging-net

  web:
    build:
      context: ../src/frontend
      dockerfile: ../../infra/docker/Dockerfile.web
      args:
        BUILD_ID: ${BUILD_ID:-staging-latest}
        APP_VERSION: ${APP_VERSION:-1.0.0}
        DEPLOY_TIME: ${DEPLOY_TIME:-}
    container_name: elektriklioto-web-staging
    restart: unless-stopped
    env_file:
      - ./env/.env.staging
    environment:
      NODE_ENV: staging
      PORT: 3001
      NUXT_PUBLIC_API_BASE: https://api-staging.elektriklioto.com
      NUXT_PUBLIC_BUILD_ID: ${BUILD_ID:-staging-latest}
    ports:
      - "3001:3001"
    depends_on:
      - api
    networks:
      - elektriklioto-staging-net

  nginx:
    image: nginx:1.27-alpine
    container_name: elektriklioto-nginx-staging
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - elektriklioto-staging-net

networks:
  elektriklioto-staging-net:
    driver: bridge

volumes:
  pgdata_staging:
    driver: local
