
# ==============================================================================
# elektriklioto.com - Yerel Geliştirme Docker Compose Yapılandırması
# PostgreSQL 16 + PostGIS 3.4 Mekânsal Veritabanı ve Çevre Servisleri
# ==============================================================================

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: elektriklioto-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-elektriklioto}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elektriklioto"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - elektriklioto-net

volumes:
  pgdata_dev:
    name: elektriklioto_pgdata_dev

networks:
  elektriklioto-net:
    name: elektriklioto-local-network
    driver: bridge
