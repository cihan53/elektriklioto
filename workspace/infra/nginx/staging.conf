
# ==============================================================================
# elektriklioto.com - Staging Nginx Konfigürasyonu
# ==============================================================================

upstream staging_api {
    server api:3000;
    keepalive 16;
}

upstream staging_web {
    server web:3001;
    keepalive 16;
}

# 1. Staging API: api-staging.elektriklioto.com
server {
    listen 80;
    server_name api-staging.elektriklioto.com;

    location / {
        proxy_pass http://staging_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Staging Web: staging.elektriklioto.com
server {
    listen 80;
    server_name staging.elektriklioto.com;

    location / {
        proxy_pass http://staging_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
