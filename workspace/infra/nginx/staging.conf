
# ==============================================================================
# elektriklioto.com - Staging Nginx Konfigürasyonu
# TALEP-012: Sürüm Polling ve Otomatik Yenilenme Uç Noktası
# ==============================================================================

upstream staging_api {
    server api:3000;
    keepalive 16;
}

upstream staging_web {
    server web:3001;
    keepalive 16;
}

# 1. Staging API: api-staging.elektriklioto.com
server {
    listen 80;
    server_name api-staging.elektriklioto.com;

    location / {
        proxy_pass http://staging_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Staging Web: staging.elektriklioto.com
server {
    listen 80;
    server_name staging.elektriklioto.com;

    # TALEP-012: Sürüm Polling Uç Noktası (Önbellek kapalı)
    location = /version.json {
        proxy_pass http://staging_web/version.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        proxy_pass http://staging_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
