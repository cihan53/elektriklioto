
# ==============================================================================
# elektriklioto.com - Üretim (Production) Nginx Konfigürasyonu
# Güvenlik, HSTS, HTTP/2, RFC 7807 Hata İletimi ve TALEP-012 Sürüm Polling
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Hız Sınırı Tanımları
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    upstream api_upstream {
        server api:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream web_upstream {
        server web:3001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # 1. HTTP -> HTTPS Yönlendirmesi (Tüm Alan Adları)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name elektriklioto.com www.elektriklioto.com api.elektriklioto.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Üretim API Sunucusu: api.elektriklioto.com
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl;
        http2 on;
        server_name api.elektriklioto.com;

        # SSL Konfigürasyonu
        ssl_certificate /etc/nginx/ssl/live/api.elektriklioto.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/api.elektriklioto.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Güvenlik Başlıkları
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Sağlık Denetimi (Hız sınırı muaf)
        location /health {
            proxy_pass http://api_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Genel API Yönlendirmesi
        location / {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }

    # 3. Üretim Web Sunucusu: elektriklioto.com (Nuxt 3 SSR)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name elektriklioto.com www.elektriklioto.com;

        # www -> kanonik non-www yönlendirmesi
        if ($host = 'www.elektriklioto.com') {
            return 301 https://elektriklioto.com$request_uri;
        }

        ssl_certificate /etc/nginx/ssl/live/elektriklioto.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/elektriklioto.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # TALEP-012: Sürüm Polling ve Canlı Yenilenme Uç Noktası
        # Yeni deploy çıktığında açık sayfaların polling ile anında fark edebilmesi için
        # bu uç nokta KESİNLİKLE önbelleklenmemelidir (no-cache, no-store, max-age=0).
        location = /version.json {
            proxy_pass http://web_upstream/version.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Nuxt Statik Varlıklar (Önbellek 1 Yıl)
        location /_nuxt/ {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SSR Web Sayfaları
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
