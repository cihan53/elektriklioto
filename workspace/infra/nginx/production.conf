
# ==============================================================================
# elektriklioto.com - Nginx Üretim Ters Vekil Yapılandırması
# TALEP-012 Sürüm Uç Noktası No-Cache Direktifleri Dahil
# ==============================================================================

# 1. HTTP -> HTTPS Yönlendirmesi
server {
    listen 80;
    listen [::]:80;
    server_name elektriklioto.com www.elektriklioto.com api.elektriklioto.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Fastify API (api.elektriklioto.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.elektriklioto.com;

    ssl_certificate /etc/letsencrypt/live/api.elektriklioto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.elektriklioto.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 3. Nuxt 3 Web SSR (elektriklioto.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elektriklioto.com www.elektriklioto.com;

    ssl_certificate /etc/letsencrypt/live/elektriklioto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elektriklioto.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # TALEP-012: /version.json için Kesin Önbellek Engelleme (Zero-Cache)
    location = /version.json {
        proxy_pass http://web:3001/version.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Statik Varlıklar ve Sayfalar
    location / {
        proxy_pass http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
