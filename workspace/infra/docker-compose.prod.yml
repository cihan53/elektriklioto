
# ==============================================================================
# elektriklioto.com - Üretim Docker Compose Orkestrasyonu
# Sprint: S5-S13 — Modüler Monolit, Bağımsız Worker, Web SSR, Nginx ve PostGIS
# ==============================================================================

services:
  # 1. Mekânsal İlişkisel Veritabanı (PostgreSQL 16 + PostGIS 3.4)
  postgres:
    image: postgis/postgis:16-3.4
    container_name: elektriklioto-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-elektriklioto_prod}
      POSTGRES_USER: ${DB_USER:-prod_db_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-prod_db_user} -d ${DB_NAME:-elektriklioto_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - elektriklioto-prod-net

  # 2. Fastify API Süreci (api.elektriklioto.com)
  api:
    build:
      context: ../../workspace/src/backend
      dockerfile: ../../workspace/infra/docker/Dockerfile.api
    container_name: elektriklioto-api-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${DB_USER:-prod_db_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-elektriklioto_prod}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elektriklioto-prod-net

  # 3. Bağımsız Worker Süreci (Aggregator & Health Evaluator)
  worker:
    build:
      context: ../../workspace/src/backend
      dockerfile: ../../workspace/infra/docker/Dockerfile.worker
    container_name: elektriklioto-worker-prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-prod_db_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-elektriklioto_prod}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elektriklioto-prod-net

  # 4. Nuxt 3 Web SSR Platformu (elektriklioto.com)
  web:
    build:
      context: ../../workspace/src/frontend
      dockerfile: ../../workspace/infra/docker/Dockerfile.web
      args:
        BUILD_ID: ${BUILD_ID:-prod-manual}
        DEPLOY_TIME: ${DEPLOY_TIME:-}
    container_name: elektriklioto-web-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://api.elektriklioto.com}
      NUXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_ACCESS_TOKEN}
    depends_on:
      - api
    networks:
      - elektriklioto-prod-net

  # 5. Nginx Ters Vekil & SSL Sonlandırıcı
  nginx:
    image: nginx:alpine
    container_name: elektriklioto-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
    networks:
      - elektriklioto-prod-net

volumes:
  pgdata_prod:
    name: elektriklioto_pgdata_prod

networks:
  elektriklioto-prod-net:
    name: elektriklioto-production-network
    driver: bridge
