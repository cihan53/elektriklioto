name: Deploy to cPanel & Create Version Tag

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Otomatik Versiyon Tag'i ve Release Oluşturma
  version_and_release:
    name: Create Tag & Release
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: master,main
          tag_prefix: v
          fetch_all_tags: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.tag_version.outputs.new_tag }}
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # 2. cPanel Sunucusuna Otomatik Dağıtım (Deploy)
  deploy:
    name: Build & Deploy to cPanel
    needs: version_and_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Backend (Fastify API)
        run: |
          echo "==> Backend bağımlılıkları kuruluyor ve derleniyor..."
          cd workspace/src/backend
          npm install
          npm run build
          npm prune --omit=dev

      - name: Build Frontend (Nuxt 3 SSR)
        run: |
          echo "==> Frontend bağımlılıkları kuruluyor ve derleniyor..."
          cd workspace/src/frontend
          npm install --ignore-scripts
          npm run build

      - name: Package Deployment Archive
        run: |
          echo "==> Dağıtım arşivi paketleniyor..."
          tar -czf deploy_package.tar.gz \
            cpanel_api_entry.cjs \
            cpanel_nuxt_entry.cjs \
            .htaccess \
            .env.cpanel.example \
            scripts/ \
            workspace/src/backend/dist \
            workspace/src/backend/node_modules \
            workspace/src/backend/package.json \
            workspace/src/frontend/.output

      - name: Transfer Archive to cPanel via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: "deploy_package.tar.gz"
          target: "${{ secrets.CPANEL_APP_DIR || 'app' }}"

      - name: Extract Archive & Restart Passenger on cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script_stop: true
          script: |
            APP_DIR="${{ secrets.CPANEL_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/app"
            fi
            APP_DIR="${APP_DIR/#\~/$HOME}"
            echo "==> Proje dizinine ($APP_DIR) gidiliyor..."
            cd "$APP_DIR"

            echo "==> Paket arşivden çıkarılıyor..."
            tar -xzf deploy_package.tar.gz
            rm -f deploy_package.tar.gz

            mkdir -p tmp logs
            chmod +x scripts/cron_daily_sync.sh 2>/dev/null || true
            chmod +x scripts/import_cpo_stations.py 2>/dev/null || true

            touch tmp/restart.txt
            echo "==> Dağıtım ve Passenger restart başarıyla tamamlandı: ${{ needs.version_and_release.outputs.new_tag || 'v1.0.0' }}"
