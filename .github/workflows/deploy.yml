name: Deploy to cPanel & Create Version Tag

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Otomatik Versiyon Tag'i ve Release Oluşturma
  version_and_release:
    name: Create Tag & Release
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: master,main
          tag_prefix: v
          fetch_all_tags: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.tag_version.outputs.new_tag }}
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # 2. cPanel Sunucusuna Otomatik Dağıtım (Deploy)
  deploy:
    name: Deploy to cPanel via SSH
    needs: version_and_release
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "==> SSH Bağlantısı Başarılı: $(whoami) @ $(hostname 2>/dev/null || echo 'cpanel')"
            echo "==> Mevcut dizin: $(pwd), Ev dizini: $HOME"

            APP_DIR="${{ secrets.CPANEL_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/app"
            fi
            APP_DIR="${APP_DIR/#\~/$HOME}"
            echo "==> Proje hedef dizini: $APP_DIR"

            if ! mkdir -p "$APP_DIR" 2>/dev/null; then
              echo "UYARI: Hedef dizin oluşturulamadı, varsayılan $HOME/app dizini kullanılıyor..."
              APP_DIR="$HOME/app"
              mkdir -p "$APP_DIR"
            fi
            cd "$APP_DIR"
            echo "==> Aktif çalışma dizini: $(pwd)"

            if [ ! -d ".git" ]; then
              echo "==> İlk kurulum: Git deposu klonlanıyor..."
              git clone -b ${{ github.ref_name }} https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              echo "==> Conflict (çakışma) önleyici güncelleme yapılıyor..."
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git || true
              git fetch origin ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
            fi

            echo "==> Dağıtım betiği (.github/scripts/deploy.sh) çalıştırılıyor..."
            bash .github/scripts/deploy.sh

            echo "==> Dağıtım başarıyla tamamlandı: ${{ needs.version_and_release.outputs.new_tag || 'v1.0.0' }}"
